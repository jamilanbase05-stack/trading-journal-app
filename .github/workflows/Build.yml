
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Install dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli

      - name: Create web app
        run: |
          mkdir -p www
          echo '<html><head><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><h1>Trading Journal</h1><p>My Trading Journal App</p></body></html>' > www/index.html

      - name: Configure Capacitor
        run: |
          npx cap init "Trading Journal" "com.trading.journal" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trading-Journal-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
