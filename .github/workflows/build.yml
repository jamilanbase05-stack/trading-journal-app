name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Android APK
        uses: subhash-subu/web-to-apk-action@v1.1
        with:
          app-name: 'Trading Journal Pro'
          web-url: 'https://raw.githack.com/${{ github.repository }}/main/index.html'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trading-Journal-APK
          path: './*.apk'
